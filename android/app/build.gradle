plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// The words live in ios/dinnerdesk/copy.json, shared with iOS and the website. Bundle that file as-is.
def sharedCopy = layout.buildDirectory.dir('generated/sharedCopy')
def syncSharedCopy = tasks.register('syncSharedCopy', Sync) {
    from(rootProject.file('../ios/dinnerdesk/copy.json'))
    into(sharedCopy)
}

android {
    namespace 'build.computerscience.dinnerdesk'
    compileSdk 36
    defaultConfig {
        applicationId 'build.computerscience.dinnerdesk'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'APP_ORIGIN', '"https://dinnerdesk.computerscience.build"'
    }
    sourceSets { main { assets.srcDirs += sharedCopy } }
    buildFeatures { buildConfig true; compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            // Test a branch's HTTPS server before it ships: ./gradlew assembleDebug -PdinnerdeskApiOrigin=https://...
            if (project.hasProperty('dinnerdeskApiOrigin')) {
                buildConfigField 'String', 'APP_ORIGIN', "\"${project.property('dinnerdeskApiOrigin')}\""
            }
        }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    // Set these in your environment, never commit signing keys or passwords.
    if (System.getenv('DINNERDESK_UPLOAD_KEYSTORE')) {
        signingConfigs {
            upload {
                storeFile file(System.getenv('DINNERDESK_UPLOAD_KEYSTORE'))
                storePassword System.getenv('DINNERDESK_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('DINNERDESK_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('DINNERDESK_UPLOAD_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.upload
    }
    lint { abortOnError true }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

tasks.named('preBuild') { dependsOn syncSharedCopy }

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
