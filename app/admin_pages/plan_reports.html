<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan reports</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --line: #e3dfd8; --chip: #efece6;
    --accent: #2a78d6; --flag: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --card: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --line: #35322d; --chip: #2c2a26;
            --accent: #3987e5; --flag: #e66767; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .filters button, .filters select { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .savebar { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .savebar button { background: var(--accent); color: #fff; border-color: var(--accent); }
  .savebar span { color: var(--muted); font-size: 12px; }
  .panel, .report { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .report { border-left: 4px solid var(--flag); }
  .report[data-status="done"], .report[data-status="later"], .report[data-status="wontfix"] { opacity: .75; }
  .report[data-status="rereview"] { border-left-color: var(--accent); }
  .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .head strong { color: var(--ink); font-size: 15px; }
  .complaint { font-size: 17px; margin: 8px 0 12px; }
  .complaint.empty { color: var(--muted); font-style: italic; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .chip { display: inline-block; background: var(--chip); border-radius: 4px; padding: 0 7px; margin: 1px 4px 1px 0; font-size: 12px; }
  .chip.changed { box-shadow: inset 0 0 0 1px var(--flag); }
  .chip.backup { background: transparent; box-shadow: inset 0 0 0 1px var(--flag); color: var(--flag); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tablewrap { overflow-x: auto; margin-top: 12px; }
  details { margin-top: 8px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--muted); }
  .warn { color: var(--flag); font-weight: 600; }
  .mine { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .mine .who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); align-self: center; }
  .mine select, .mine textarea, #plans { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; font: inherit; font-size: 13px; padding: 5px 8px; }
  .mine textarea { flex: 1 1 280px; min-height: 34px; resize: vertical; }
  #plans { width: 100%; min-height: 100px; resize: vertical; }
  .emptystate { color: var(--muted); padding: 24px 0; text-align: center; }
  .home { display: inline-block; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <a class="home" href="/">← Dinnerdesk</a>
  <h1>Plan reports</h1>
  <p class="sub" id="sub"></p>
  <div class="filters" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="open" aria-pressed="false">Not dealt with</button>
    <button data-f="todo" aria-pressed="false">My to-fix list</button>
    <select id="household" aria-label="Household"></select>
    <div class="savebar"><span id="saved"></span><button id="export">Export my notes</button></div>
  </div>
  <section class="panel"><h2>My plans</h2>
    <textarea id="plans" placeholder="Patterns across reports, what to change in suggestions, follow-ups…"></textarea></section>
  <div id="list"></div>
</main>
<script>
const DATA = /*DATA*/null;
const KEY = "dinnerdesk-plan-reports-review-v1";
const STATUSES = [["", "No status"], ["todo", "To fix"], ["later", "Defer for later"], ["rereview", "Re-review"], ["idea", "Idea"],
                  ["done", "Fixed"], ["wontfix", "Won't fix"], ["ok", "Working as intended"]];
let mine = { reports: {}, plans: "", ...(DATA.review || {}) };
try { const local = JSON.parse(localStorage.getItem(KEY) || "null"); if (local && (local.saved_at || "") > (mine.saved_at || "")) mine = local; } catch (e) {}
let show = "all", household = "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const recipeLink = (id, name) => `<a href="${esc(DATA.site)}/recipes/${esc(id)}" target="_blank" rel="noopener">${esc(name || `recipe ${id}`)} ↗</a>`;
const list = items => (items && items.length) ? items.map(i => `<span class="chip">${esc(i)}</span>`).join("") : `<span class="sub">none</span>`;

function persist() {
  mine.saved_at = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {}
  document.getElementById("saved").textContent = "saved in this browser";
}

const households = [...new Set(DATA.reports.map(r => `${r.household_name || "household"} (#${r.household_id})`))].sort();
document.getElementById("household").innerHTML = `<option value="">All households</option>` + households.map(h => `<option>${esc(h)}</option>`).join("");

// Filters when suggested, next to filters when reported; changed ones are outlined.
function filtersBox(then, now) {
  const rows = [["Diets", "diets"], ["Allergies", "allergens"], ["Avoids", "avoids"]];
  const same = (a, b) => JSON.stringify([...(a || [])].sort()) === JSON.stringify([...(b || [])].sort());
  const cell = (vals, other) => (vals && vals.length)
    ? vals.map(v => `<span class="chip${other && !other.includes(v) ? " changed" : ""}">${esc(v)}</span>`).join("")
    : `<span class="sub">none</span>`;
  const time = then ? (then.filters?.max_minutes ? `${then.filters.max_minutes} min` : "any") : "";
  return `<div class="box"><h3>Filters</h3><table><tr><th></th><th>When suggested</th><th>When reported</th></tr>` +
    rows.map(([label, k]) => `<tr><td>${label}</td><td>${then ? cell(then.filters?.[k] ?? then[k], now?.[k]) : `<span class="sub">not saved</span>`}</td><td>${cell(now?.[k], then ? (then.filters?.[k] ?? then[k]) : null)}${then && now && !same(then.filters?.[k], now?.[k]) ? ` <span class="warn">changed</span>` : ""}</td></tr>`).join("") +
    (then ? `<tr><td>Max time</td><td>${esc(time)}</td><td>${esc(now?.time || "any")}</td></tr>` : "") + `</table></div>`;
}

function contextBox(ctx) {
  if (!ctx) return `<div class="box"><h3>Why it was suggested</h3><p class="sub">This plan was suggested before the app saved its reasoning.</p></div>`;
  const t = ctx.taste || {}, p = ctx.pool || {};
  const total = Object.values(ctx.steps_ms || {}).reduce((a, b) => a + b, 0);
  return `<div class="box"><h3>Why it was suggested</h3><dl class="kv">
    <dt>Suggested at</dt><dd>${esc(String(ctx.at || "").replace("T", " ").slice(0, 16))}</dd>
    <dt>Meals to pick from</dt><dd>${p.priority ?? "?"} that fit everything · ${p.backup ?? "?"} backup${p.built_now ? " · pool rebuilt for this request" : ""}</dd>
    <dt>Taste so far</dt><dd>${t.liked ?? 0} liked · ${t.passed ?? 0} passed · ${t.favorites ?? 0} ♥ · ${t.to_try ?? 0} to try · ${t.cooked ?? 0} cooked · ${t.thumbs_up ?? 0} 👍 · ${t.thumbs_down ?? 0} 👎</dd>
    <dt>Kept meals</dt><dd>${(ctx.kept_recipe_ids || []).length ? ctx.kept_recipe_ids.map(id => recipeLink(id)).join(", ") : "none"}</dd>
    <dt>Backup picks</dt><dd>${ctx.counts?.backup_picked ?? 0}</dd>
    <dt>Time taken</dt><dd>${total.toFixed(0)} ms</dd>
  </dl>
  <details><summary>Pantry (${(ctx.pantry || []).length}) and never-buy (${(ctx.never_shop || []).length})</summary>
    <p>${list(ctx.pantry)}</p><p><span class="sub">Never buy:</span> ${list(ctx.never_shop)}</p></details>
  <details><summary>Each step's time</summary><p>${Object.entries(ctx.steps_ms || {}).map(([k, v]) => `<span class="chip">${esc(k)} ${v} ms</span>`).join("")}</p></details>
  </div>`;
}

// Meals as suggested (rank, score, reasons) and what the plan holds now.
function mealsTable(plan, ctx) {
  const meals = ctx?.meals || (plan.original_recipe_ids || []).map(id => ({ id }));
  const names = Object.fromEntries((plan.slots || []).map(s => [s.recipe_id, s.recipe_name]));
  const reasons = plan.suggestion_reasons || {};
  const nowIds = new Set((plan.slots || []).map(s => s.recipe_id));
  const rows = meals.map(m => `<tr>
      <td class="num">${m.rank ? `#${m.rank}${ctx?.ranked_out_of ? ` of ${ctx.ranked_out_of}` : ""}` : "–"}</td>
      <td>${recipeLink(m.id, m.name || names[m.id])}${m.backup ? ` <span class="chip backup">backup pick</span>` : ""}${nowIds.has(m.id) ? "" : ` <span class="chip changed">swapped out</span>`}</td>
      <td class="num">${m.score != null ? Number(m.score).toFixed(2) : "–"}</td>
      <td>${(m.reasons || reasons[String(m.id)] || []).map(r => `<span class="chip">${esc(r)}</span>`).join("") || `<span class="sub">no reasons</span>`}</td></tr>`).join("");
  const swaps = (plan.changes || []).map(c => `<li>${recipeLink(c.from, names[c.from] || `recipe ${c.from}`)} → ${recipeLink(c.to, names[c.to])}${c.reason ? ` <span class="chip">${esc(c.reason)}</span>` : ""}</li>`).join("");
  const added = (plan.slots || []).filter(s => !meals.some(m => m.id === s.recipe_id));
  return `<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Meal as suggested</th><th>Score</th><th>Reasons</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${swaps ? `<details open><summary>Swaps the cook made (${(plan.changes || []).length})</summary><ul>${swaps}</ul></details>` : ""}
    ${added.length ? `<details><summary>Plan now also has</summary><p>${added.map(s => recipeLink(s.recipe_id, s.recipe_name)).join(", ")}</p></details>` : ""}`;
}

function myNotes(r) {
  const m = mine.reports[r.id] || {};
  return `<div class="mine"><span class="who">My notes</span>
    <select data-k="status" aria-label="Status">${STATUSES.map(([k, l]) => `<option value="${k}"${(m.status || "") === k ? " selected" : ""}>${l}</option>`).join("")}</select>
    <textarea data-k="note" placeholder="What went wrong, what to change…" aria-label="My note">${esc(m.note || "")}</textarea></div>`;
}

function render() {
  const dates = DATA.reports.map(r => r.created_at).sort();
  document.getElementById("sub").textContent = DATA.reports.length
    ? `${DATA.reports.length} reports from ${households.length} households, ${dates[0].slice(0, 10)} to ${dates.at(-1).slice(0, 10)} · ${DATA.source}`
    : `No reports yet · ${DATA.source}`;
  const done = new Set(["done", "wontfix", "ok"]);
  const shown = DATA.reports.filter(r => {
    const h = `${r.household_name || "household"} (#${r.household_id})`, st = (mine.reports[r.id] || {}).status || "";
    return (!household || h === household) && (show === "all" || (show === "open" && !done.has(st)) || (show === "todo" && st === "todo"));
  });
  document.getElementById("list").innerHTML = shown.map(r => {
    const plan = r.snapshot?.plan || {}, ctx = plan.context;
    const decision = plan.decision ? (plan.decision === "approve" ? "approved" : "declined") : plan.status;
    return `<article class="report" data-id="${r.id}" data-status="${esc((mine.reports[r.id] || {}).status || "")}">
      <div class="head"><strong>${esc(r.household_name || "household")} (#${r.household_id})${r.guest ? " · guest" : ""}</strong>
        <span>${esc(r.created_at.replace("T", " ").slice(0, 16))}</span><span>plan #${esc(r.plan_id)} · ${esc(decision || "")}</span></div>
      <p class="complaint${r.note ? "" : " empty"}">${r.note ? `“${esc(r.note)}”` : "No note"}</p>
      <div class="grid">${filtersBox(ctx, r.snapshot?.filters_when_reported)}${contextBox(ctx)}</div>
      ${mealsTable(plan, ctx)}
      ${plan.suggestion_note ? `<p class="sub">The app said: ${esc(plan.suggestion_note)}</p>` : ""}
      ${myNotes(r)}
    </article>`;
  }).join("") || `<div class="emptystate">${DATA.reports.length ? "No reports match." : "No reports yet. They show up here after someone taps Report this suggestion."}</div>`;
}

document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  show = b.dataset.f;
  document.querySelectorAll(".filters button[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.getElementById("household").addEventListener("change", e => { household = e.target.value; render(); });
const plans = document.getElementById("plans");
plans.value = mine.plans || "";
plans.addEventListener("input", () => { mine.plans = plans.value; persist(); });
document.getElementById("list").addEventListener("input", e => {
  const card = e.target.closest(".report"), k = e.target.dataset.k;
  if (!card || !k) return;
  const m = mine.reports[card.dataset.id] ||= {};
  m[k] = e.target.value;
  if (k === "status") card.dataset.status = e.target.value;
  persist();
});
document.getElementById("export").addEventListener("click", async () => {
  const text = JSON.stringify({ ...mine, exported_at: new Date().toISOString() }, null, 2) + "\n";
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName: "plan_reports_review.json", types: [{ accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
      document.getElementById("saved").textContent = "exported"; return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = "plan_reports_review.json"; document.body.append(a); a.click(); a.remove();
  document.getElementById("saved").textContent = "downloaded plan_reports_review.json";
});
render();
</script>
</body>
</html>
