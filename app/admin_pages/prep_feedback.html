<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prep feedback</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --line: #e3dfd8; --chip: #efece6;
    --up: #2a78d6; --down: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --card: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --line: #35322d; --chip: #2c2a26;
            --up: #3987e5; --down: #e66767; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .filters button, .filters select { border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .tile .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
  .panels { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .bars { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 8px 10px; align-items: center; font-size: 13px; }
  .bars .name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { display: flex; gap: 2px; align-items: center; height: 18px; }
  .seg { height: 14px; border-radius: 0 4px 4px 0; min-width: 4px; }
  .seg.up { background: var(--up); border-radius: 0; }
  .seg.up:last-of-type, .seg.down { border-radius: 0 4px 4px 0; }
  .seg:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 6px; font-size: 12px; white-space: nowrap; }
  .group { margin-top: 18px; }
  .group h3 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .group h3 span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .vote { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
          border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .vote.up { border-left-color: var(--up); }
  .vote.down { border-left-color: var(--down); }
  .vote .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .vote .verdict { font-weight: 650; }
  .vote .step { margin: 4px 0; }
  .vote .meta { color: var(--muted); font-size: 12px; }
  .vote .meta a { color: var(--up); text-decoration: none; font-weight: 600; }
  .vote .meta a:hover { text-decoration: underline; }
  .chip { background: var(--chip); border-radius: 4px; padding: 1px 7px; font-size: 12px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
  @media (max-width: 700px) { .compare { grid-template-columns: 1fr; } }
  .side { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .side .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .side .big { font-weight: 600; font-size: 14px; }
  .side ul { margin: 4px 0 0; padding-left: 16px; }
  .side .amounts { color: var(--muted); white-space: pre-line; margin-top: 4px; }
  .side .warn { color: var(--down); font-weight: 600; }
  mark { background: color-mix(in srgb, var(--down) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
  details { margin-top: 6px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--muted); }
  details ol { margin: 6px 0 0; padding-left: 22px; }
  details li { margin: 3px 0; }
  details li.here { background: var(--chip); border-radius: 4px; padding: 2px 6px; font-weight: 600; }
  details li .amounts { color: var(--muted); font-weight: 400; white-space: pre-line; display: block; }
  .note { margin: 6px 0 0; padding: 6px 10px; border-left: 3px solid var(--line); color: var(--ink); font-style: italic; }
  .empty { color: var(--muted); padding: 20px 0; }
  .mine { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .mine select, .mine textarea, #plans { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 8px; font: inherit; font-size: 13px; padding: 5px 8px; }
  .mine textarea { flex: 1 1 260px; min-height: 34px; resize: vertical; }
  #plans { width: 100%; min-height: 110px; resize: vertical; }
  .mine .who { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); align-self: center; }
  .vote[data-status="todo"] { box-shadow: inset 0 0 0 1px var(--down); }
  .vote[data-status="done"], .vote[data-status="later"] { opacity: .75; }
  .vote[data-status="rereview"] { box-shadow: inset 0 0 0 1px var(--up); }
  .savebar { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .savebar button { border: 1px solid var(--up); background: var(--up); color: #fff; border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .savebar span { color: var(--muted); font-size: 12px; }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px;
         padding: 5px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 9; max-width: 260px; }
  .home { display: inline-block; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <a class="home" href="/">← Dinnerdesk</a>
  <h1>Prep feedback</h1>
  <p class="sub" id="sub"></p>
  <div class="filters" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="up" aria-pressed="false">👍 Helpful</button>
    <button data-f="down" aria-pressed="false">👎 Not helpful</button>
    <button data-f="missing" aria-pressed="false">Missing steps</button>
    <select id="household" aria-label="Household"></select>
    <button data-f="todo" aria-pressed="false">My to-fix list</button>
    <div class="savebar"><span id="saved"></span><button id="export">Export my notes</button></div>
  </div>
  <section class="panel" style="margin-bottom:16px"><h2>My plans</h2>
    <textarea id="plans" placeholder="What to change in the prep feature, ideas, follow-ups…"></textarea></section>
  <div class="tiles" id="tiles"></div>
  <div class="panels">
    <section class="panel"><h2>Why steps got 👎</h2><div class="bars" id="reasons"></div></section>
    <section class="panel"><h2>By prep task</h2>
      <div class="legend"><span><i style="background:var(--up)"></i>👍 Helpful</span><span><i style="background:var(--down)"></i>👎 Not helpful</span></div>
      <div class="bars" id="tasks"></div></section>
  </div>
  <section class="panel"><h2>Every vote</h2><div id="list"></div></section>
</main>
<div id="tip" role="tooltip"></div>
<script>
const DATA = /*DATA*/null;
let show = "all", household = "";
// Your notes: the exported file (built into the page) first, then anything newer in this browser.
const KEY = "dinnerdesk-prep-feedback-review-v1";
let mine = { votes: {}, plans: "", ...(DATA.review || {}) };
try { const local = JSON.parse(localStorage.getItem(KEY) || "null"); if (local && (local.saved_at || "") > (mine.saved_at || "")) mine = local; } catch (e) {}
function persist() {
  mine.saved_at = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {}
  document.getElementById("saved").textContent = "saved in this browser";
}
const STATUSES = [["", "No status"], ["todo", "To fix"], ["later", "Defer for later"], ["rereview", "Re-review"], ["idea", "Idea"],
                  ["done", "Fixed"], ["wontfix", "Won't fix"], ["ok", "Working as intended"]];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const households = [...new Set(DATA.votes.map(v => v.household))].sort();
document.getElementById("household").innerHTML =
  `<option value="">All households</option>` + households.map(h => `<option>${esc(h)}</option>`).join("");

function visible() {
  return DATA.votes.filter(v =>
    (!household || v.household === household) &&
    (show === "all" || (show === "up" && v.up && !v.missing) || (show === "down" && !v.up) || (show === "missing" && v.missing) ||
     (show === "todo" && (mine.votes[v.id] || {}).status === "todo")));
}

// What the prep task told the cook, next to what the recipe step actually says.
function compare(v) {
  const t = v.prep_task, rs = v.recipe_steps || { steps: [] };
  const at = rs.at, step = at != null ? rs.steps[at] : null;
  const left = v.missing
    ? `<div class="label">Suggested by the cook</div><div class="big">Missing prep step</div>`
    : t
    ? `<div class="label">Prep task told them</div><div class="big">${esc(t.title)}</div>
       ${t.amounts.length ? `<div class="amounts">${t.amounts.map(esc).join("\n")}</div>` : ""}
       ${t.bundled.length > 1 ? `<div style="margin-top:6px">Steps in this task:</div><ul>${t.bundled.map(b => `<li>${esc(b.text)}${b.recipe !== v.recipe ? ` <span class="amounts">(${esc(b.recipe)})</span>` : ""}</li>`).join("")}</ul>` : ""}
       <div class="amounts">week of ${esc(t.plan_week)}${t.done ? " · checked off" : ""}</div>`
    : `<div class="label">Prep task told them</div><div class="amounts">Task not found in the export.</div>`;
  const right = step
    ? `<div class="label">Recipe actually says · step ${at + 1} of ${rs.steps.length}</div>
       <div>${highlight(step.text, v.step)}</div>
       ${step.amounts ? `<div class="amounts">${esc(step.amounts)}</div>` : ""}`
    : `<div class="label">Recipe actually says</div><div class="big">${esc(v.step)}</div>
       ${rs.steps.length ? `<div class="warn">This step isn't in the recipe anymore. It may have been rewritten since the vote.</div>` : ""}`;
  return `<div class="compare"><div class="side">${left}</div><div class="side">${right}</div></div>`;
}

function myNotes(v) {
  const m = mine.votes[v.id] || {};
  return `<div class="mine"><span class="who">My notes</span>
    <select data-k="status" aria-label="Status">${STATUSES.map(([k, l]) => `<option value="${k}"${(m.status || "") === k ? " selected" : ""}>${l}</option>`).join("")}</select>
    <textarea data-k="note" placeholder="What I think, what to change…" aria-label="My note">${esc(m.note || "")}</textarea></div>`;
}

function highlight(text, part) {
  const i = part ? text.toLowerCase().indexOf(part.toLowerCase().trim()) : -1;
  if (i < 0 || part.trim().length === text.trim().length) return `<span class="big">${esc(text)}</span>`;
  const n = part.trim().length;
  return esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + n))}</mark>` + esc(text.slice(i + n));
}

function fullRecipe(v) {
  const rs = v.recipe_steps || { steps: [] };
  if (!rs.steps.length) return "";
  return `<details><summary>Full recipe: ${rs.steps.length} steps</summary><ol>${rs.steps.map((st, i) =>
    `<li class="${i === rs.at ? "here" : ""}">${i === rs.at ? highlight(st.text, v.step) : esc(st.text)}${st.amounts ? `<span class="amounts">${esc(st.amounts)}</span>` : ""}</li>`).join("")}</ol></details>`;
}

function render() {
  const vs = visible();
  const all = DATA.votes.filter(v => !household || v.household === household);
  const dates = DATA.votes.map(v => v.date).filter(Boolean).sort();
  document.getElementById("sub").textContent =
    `${DATA.votes.length} votes from ${households.length} households, ${dates[0] || "?"} to ${dates.at(-1) || "?"} · ${DATA.source}`;

  const up = all.filter(v => v.up && !v.missing).length, down = all.filter(v => !v.up).length, miss = all.filter(v => v.missing).length;
  const tile = (n, l, color) => `<div class="tile"><div class="n">${n}</div><div class="l">${color ? `<span class="swatch" style="background:${color}"></span>` : ""}${l}</div></div>`;
  document.getElementById("tiles").innerHTML =
    tile(all.length, "votes") + tile(up, "👍 helpful steps", "var(--up)") + tile(down, "👎 not helpful", "var(--down)") + tile(miss, "missing steps suggested");

  // Why 👎: one series, so the title names it and no legend is needed.
  const downs = all.filter(v => !v.up);
  const reasons = {};
  downs.forEach(v => { const r = v.reason || "No reason given"; reasons[r] = (reasons[r] || 0) + 1; });
  const rmax = Math.max(1, ...Object.values(reasons));
  document.getElementById("reasons").innerHTML = Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([r, n]) =>
    `<div class="name" title="${esc(r)}">${esc(r)}</div><div class="track"><div class="seg down" style="width:${(100 * n / rmax).toFixed(1)}%" data-tip="${esc(r)}: ${n} of ${downs.length} 👎"></div><span class="count">${n}</span></div>`
  ).join("") || `<div class="empty">No 👎 votes.</div>`;

  // By task: 👍 then 👎 in one bar per task, same scale for every row.
  const tasks = {};
  all.filter(v => !v.missing).forEach(v => { const t = tasks[v.task] ||= { up: 0, down: 0 }; v.up ? t.up++ : t.down++; });
  const tmax = Math.max(1, ...Object.values(tasks).map(t => t.up + t.down));
  document.getElementById("tasks").innerHTML = Object.entries(tasks).sort((a, b) => (b[1].up + b[1].down) - (a[1].up + a[1].down) || b[1].down - a[1].down).map(([t, c]) =>
    `<div class="name" title="${esc(t)}">${esc(t)}</div><div class="track">` +
    (c.up ? `<div class="seg up" style="width:${(100 * c.up / tmax).toFixed(1)}%" data-tip="${esc(t)}: ${c.up} 👍"></div>` : "") +
    (c.down ? `<div class="seg down" style="width:${(100 * c.down / tmax).toFixed(1)}%" data-tip="${esc(t)}: ${c.down} 👎"></div>` : "") +
    `<span class="count">${c.up} 👍 · ${c.down} 👎</span></div>`
  ).join("") || `<div class="empty">No votes on prep tasks.</div>`;

  // Every vote, grouped by prep task, 👎 first within each task.
  const groups = {};
  vs.forEach(v => (groups[v.missing ? "Missing prep steps people suggested" : v.task] ||= []).push(v));
  document.getElementById("list").innerHTML = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([t, items]) => {
    const u = items.filter(v => v.up).length, d = items.length - u;
    return `<div class="group"><h3>${esc(t)}<span>${u} 👍 · ${d} 👎</span></h3>` +
      items.sort((a, b) => a.up - b.up).map(v => `<article class="vote ${v.up ? "up" : "down"}" data-id="${esc(v.id)}" data-status="${esc((mine.votes[v.id] || {}).status || "")}">
        <div class="top"><span class="verdict">${v.missing ? "➕ Missing step" : v.up ? "👍 Helpful" : "👎 Not helpful"}</span>
          ${v.reason && !v.missing ? `<span class="chip">${esc(v.reason)}</span>` : ""}
          ${v.missing ? "" : `<span class="chip">${v.suggested_by_app ? "step the app picked" : "recipe tagged it as prep"}</span>`}</div>
        ${compare(v)}
        ${v.note ? `<p class="note">“${esc(v.note)}”</p>` : ""}
        ${fullRecipe(v)}
        <div class="meta"><a href="${esc(v.recipe_url)}" target="_blank" rel="noopener">${esc(v.recipe)} ↗</a> · ${esc(v.household)}${v.guest ? " · guest" : ""}${v.date ? " · " + esc(v.date) : ""}</div>
        ${myNotes(v)}
      </article>`).join("") + `</div>`;
  }).join("") || `<div class="empty">No votes match.</div>`;
}

document.querySelector(".filters").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  show = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
document.getElementById("household").addEventListener("change", e => { household = e.target.value; render(); });
const plans = document.getElementById("plans");
plans.value = mine.plans || "";
plans.addEventListener("input", () => { mine.plans = plans.value; persist(); });
document.getElementById("list").addEventListener("input", e => {
  const card = e.target.closest(".vote"), k = e.target.dataset.k;
  if (!card || !k) return;
  const m = mine.votes[card.dataset.id] ||= {};
  m[k] = e.target.value;
  if (k === "status") card.dataset.status = e.target.value;
  persist();
});
document.getElementById("export").addEventListener("click", async () => {
  const text = JSON.stringify({ ...mine, exported_at: new Date().toISOString() }, null, 2) + "\n";
  if (window.showSaveFilePicker) {
    try {
      const h = await showSaveFilePicker({ suggestedName: "prep_feedback_review.json", types: [{ accept: { "application/json": [".json"] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
      document.getElementById("saved").textContent = "exported"; return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = "prep_feedback_review.json"; document.body.append(a); a.click(); a.remove();
  document.getElementById("saved").textContent = "downloaded prep_feedback_review.json";
});

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest?.("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY + 14) + "px";
  tip.style.opacity = 1;
});
render();
</script>
</body>
</html>
